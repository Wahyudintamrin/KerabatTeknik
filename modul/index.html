<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerabat Teknik · Modul Digital Diagnosis Sistem Starter</title>
<style>
:root{--blue:#0B3C8C;--blue2:#1F57C8;--yellow:#FFC72C;--red:#D7263D;--sky:#EAF1FB;--ink:#10203d;--mut:#5b6882;--ok:#17803d;--bad:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f7fc;color:var(--ink);line-height:1.55;font-size:16px}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:#f4f7fc}
header{background:var(--blue2);color:#fff;padding:18px 18px 14px}
header h1{font-size:1.05rem;line-height:1.35}
header p{font-size:.78rem;opacity:.9;margin-top:6px}
nav{display:flex;gap:8px;padding:12px 14px 6px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid #cfd9ea;background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:.8rem;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.bar{height:6px;margin:6px 14px 4px;border-radius:9px;background:#d5deee;overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:var(--yellow);transition:width .3s}
main{padding:10px 14px 40px}
.card{background:#fff;border:1px solid #dbe3f1;border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:1.1rem;margin-bottom:10px}
h3{font-size:.9rem;color:var(--blue2);margin:16px 0 8px}
p{margin-bottom:10px}
ol,ul{margin:0 0 10px 22px}
.warn{background:#fdecee;border-left:5px solid var(--red);padding:10px 12px;border-radius:8px;font-size:.88rem;margin-top:8px}
.tip{background:#fff6d6;border-left:5px solid var(--yellow);padding:10px 12px;border-radius:8px;font-size:.88rem;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:6px 0}
th,td{border:1px solid #d5deee;padding:8px;text-align:left;vertical-align:top}
th{background:var(--sky)}
.skor{font-size:.85rem;color:var(--mut)}
.q{font-size:.95rem;font-weight:600;color:var(--blue2);margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid #cfd9ea;border-radius:12px;background:#fff;font:inherit;font-size:.95rem;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue2)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{font-size:.88rem;margin-top:6px}
.btn{display:inline-block;margin-top:8px;padding:11px 20px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--blue);border:1px solid var(--blue);margin-left:8px}
textarea{width:100%;min-height:110px;border:1px solid #cfd9ea;border-radius:12px;padding:10px;font:inherit;font-size:.9rem;resize:vertical}
.big{font-size:2.2rem;font-weight:700;color:var(--blue)}
footer{text-align:center;font-size:.72rem;color:var(--mut);padding:0 14px 24px}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Kerabat Teknik · Modul Digital Diagnosis Sistem Starter</h1>
  <p>Untuk SMK TKR/TBSM · konteks mesin perahu pinisi · dapat dibuka tanpa instalasi, juga luring setelah dimuat</p>
</header>
<nav id="nav"></nav>
<div class="bar"><i id="bar"></i></div>
<main id="main"></main>
<footer>Kerabat Teknik · Dari Alat ke Kompetensi · Kelompok 4 Edupreneurship</footer>
</div>

<script>
var TABS = ['1 Pembuka','2 Materi','3 Kasus','4 Refleksi'];
var CASES = [
 {t:'Kasus 1 · Mesin tempel perahu nelayan',
  q:'Nelayan menekan START: hanya terdengar klik, lampu panel meredup. Tegangan baterai saat diam 12,4 V, saat START turun menjadi 8,5 V.',
  o:['Busi kotor dan perlu dibersihkan','Baterai lemah atau sambungan terminal buruk','Roda gigi flywheel aus'],a:1,
  e:'Tegangan jatuh dalam saat beban menandakan baterai lemah atau hambatan di terminal. Uji lanjutan: ukur drop tegangan di tiap terminal dan kencangkan atau bersihkan.',
  s:'Busi tidak berhubungan dengan bunyi klik dan lampu redup; roda gigi flywheel aus biasanya menimbulkan bunyi gerinda, bukan tegangan jatuh.'},
 {t:'Kasus 2 · Kapal kayu bermesin diesel',
  q:'Punggawa memutar kunci ke START: tidak ada bunyi apa pun dan motor tidak berputar. Lampu panel tetap terang, tegangan baterai 12,6 V dan tidak turun saat START. Voltmeter di terminal kumparan solenoid menunjukkan 0 V.',
  o:['Baterai lemah','Motor starter macet','Sirkuit kontrol putus (kunci kontak, relay, atau kabel ke solenoid)'],a:2,
  e:'Baterai baik dan lampu terang, tetapi tidak ada tegangan ke kumparan solenoid. Arus kecil dari kunci tidak sampai ke solenoid. Periksa kunci kontak, relay, sekering, dan kabel kontrol secara berurutan dengan voltmeter.',
  s:'Baterai lemah akan membuat tegangan jatuh dan lampu redup. Motor starter macet biasanya terdengar dengung atau klik, dan tegangan di solenoid ada.'},
 {t:'Kasus 3 · Bengkel latihan SMK',
  q:'Di trainer bengkel, siswa menekan START: terdengar dengung, motor starter tidak berputar. Lampu tidak terlalu redup, baterai 12,4 V, dan tegangan di solenoid terukur normal.',
  o:['Sirkuit kontrol putus','Motor starter macet atau arus berlebih; poros tertahan','Busi kotor'],a:1,
  e:'Ada dengung dan tegangan ke solenoid normal, artinya perintah sampai tetapi motor tidak berputar. Matikan dulu, putar poros secara manual, lalu cek arus dan sekering.',
  s:'Sirkuit kontrol yang putus tidak menghasilkan dengung. Busi tidak berkaitan dengan motor starter yang diam.'}
];
var st = {tab:0, ans:[null,null,null], note:''};
try{ var sv=JSON.parse(localStorage.getItem('kt-modul')||'null'); if(sv){st=sv;} }catch(e){}
function save(){ try{localStorage.setItem('kt-modul',JSON.stringify(st));}catch(e){} }
function score(){ return st.ans.filter(function(a,i){return a===CASES[i].a;}).length; }
function done(){ return st.ans.filter(function(a){return a!==null;}).length; }
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function view(){
  var nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(function(t,i){return '<button class="'+(i===st.tab?'on':'')+'" onclick="go('+i+')">'+t+'</button>';}).join('');
  document.getElementById('bar').style.width=((st.tab+1)*25)+'%';
  var h='';
  if(st.tab===0){
    h='<div class="card"><h2>Selamat datang, calon teknisi!</h2>'+
    '<p>Modul ini melatih kamu <b>berpikir diagnostik</b>: membaca gejala, menduga penyebab, lalu menguji. Konteksnya dekat dengan daerah kita: mesin perahu di Sulawesi Selatan.</p>'+
    '<h3>Tujuan pembelajaran</h3><ol><li>Menjelaskan alur arus pada sistem starter.</li><li>Menghubungkan gejala dengan dugaan penyebab.</li><li>Memilih langkah uji yang aman dan berurutan.</li></ol>'+
    '<h3>Belajar berkelompok: punggawa dan sawi</h3>'+
    '<p>Kerjakan kasus berkelompok. <b>Punggawa</b> memimpin diskusi dan mengambil keputusan, <b>sawi</b> mengukur dan mencatat. Bergantian peran tiap kasus agar semua belajar memimpin.</p>'+
    '<div class="warn"><b>Keselamatan:</b> lepas kabel negatif baterai sebelum membongkar sambungan, jangan menghubungkan terminal besar dengan logam, dan gunakan alat ukur dengan benar.</div>'+
    '<button class="btn" onclick="go(1)">Mulai belajar</button></div>';
  } else if(st.tab===1){
    h='<div class="card"><h2>Materi: sistem starter</h2>'+
    '<p>Alur arus: <b>baterai → kunci kontak → solenoid/relay → motor starter → ground</b>. Kunci hanya mengalirkan arus kecil ke solenoid; solenoid menutup kontak untuk arus besar ke motor.</p>'+
    '<h3>Tabel diagnosis cepat</h3>'+
    '<table><tr><th>Gejala</th><th>Dugaan</th><th>Uji pertama</th></tr>'+
    '<tr><td>Klik, lampu redup</td><td>Baterai lemah / terminal buruk</td><td>Tegangan saat START, drop di terminal</td></tr>'+
    '<tr><td>Senyap, lampu terang</td><td>Sirkuit kontrol / solenoid</td><td>Tegangan kumparan solenoid</td></tr>'+
    '<tr><td>Dengung, motor diam</td><td>Beban macet / arus berlebih</td><td>Putar poros manual, cek arus dan sekering</td></tr>'+
    '<tr><td>Berputar cepat, mesin tidak hidup</td><td>Pinion tidak mengait</td><td>Periksa pinion dan flywheel</td></tr></table>'+
    '<div class="tip">Urutan berpikir: <b>Amati gejala → Ukur → Duga → Uji → Simpulkan.</b></div>'+
    '<button class="btn" onclick="go(2)">Ke latihan kasus</button></div>';
  } else if(st.tab===2){
    h='<div class="card"><h2>Latihan: 3 kasus diagnosis</h2><p class="skor">Skor sementara: <b>'+score()+'</b>/3. Pilih diagnosis paling tepat. Jawaban memberi penjelasan.</p></div>';
    CASES.forEach(function(c,i){
      var a=st.ans[i];
      h+='<div class="card"><div class="q">'+esc(c.t)+'</div><p>'+esc(c.q)+'</p>';
      c.o.forEach(function(o,j){
        var cls='',L='ABC'[j];
        if(a!==null){ if(j===c.a) cls='ok'; else if(j===a) cls='no'; }
        h+='<button class="opt '+cls+'" '+(a!==null?'disabled':'')+' onclick="pick('+i+','+j+')">'+L+'. '+esc(o)+'</button>';
      });
      if(a!==null){
        h+= a===c.a ? '<p class="fb">✅ Tepat. '+esc(c.e)+'</p>' : '<p class="fb">❌ Belum tepat. '+esc(c.s)+' Jawaban yang tepat: '+'ABC'[c.a]+'. '+esc(c.e)+'</p>';
      }
      h+='</div>';
    });
    h+='<button class="btn" onclick="go(3)">Ke refleksi</button><button class="btn alt" onclick="reset()">Ulangi latihan</button>';
  } else {
    h='<div class="card"><h2>Refleksi</h2><p>Skor akhir kamu:</p><div class="big">'+score()+' / 3</div>'+
    (done()<3?'<p class="skor">Baru '+done()+' kasus dikerjakan. Selesaikan semua kasus untuk skor lengkap.</p>':'')+
    '<h3>Nilai sipakainge</h3><p>Sipakainge berarti saling mengingatkan. Saat temanmu salah menduga, ingatkan dengan baik dan ajak ia menguji ulang, seperti punggawa dan sawi yang saling menjaga keselamatan di atas perahu.</p>'+
    '<h3>Catatan belajarmu</h3><p>Apa satu hal yang kamu pelajari, dan bagian mana yang masih membingungkan?</p>'+
    '<textarea id="note" oninput="st.note=this.value;save()" placeholder="Tulis catatanmu di sini...">'+esc(st.note||'')+'</textarea>'+
    '<button class="btn" onclick="reset()">Ulangi latihan</button></div>'+
    '<div class="card"><h3 style="margin-top:0">Hubungi tim Kerabat Teknik</h3><p>Ingin demo, penawaran trainer, atau pelatihan guru? Hubungi kami lewat WhatsApp: <a href="https://wa.me/6285299557045" target="_blank" rel="noopener"><b>0852-9955-7045</b></a>.</p></div>';
  }
  document.getElementById('main').innerHTML=h;
}
function go(i){ st.tab=i; save(); view(); window.scrollTo(0,0); }
function pick(i,j){ if(st.ans[i]===null){ st.ans[i]=j; save(); view(); } }
function reset(){ st.ans=[null,null,null]; st.tab=2; save(); view(); window.scrollTo(0,0); }
view();
</script>
</body>
</html>
